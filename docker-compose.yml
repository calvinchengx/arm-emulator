# The management plane and the STS that authenticates it. entra-emulator
# issues ARM-audience tokens; arm-emulator validates them against entra's JWKS
# — the same trust relationship as production Azure.
#
# The data planes that CONSUME arm-emulator's authorization feed live in their
# own repos (azure-keyvault-emulator's compose adds itself to this pair).
services:
  entra-emulator:
    image: ghcr.io/calvinchengx/entra-emulator:latest
    environment:
      ORIGIN_MODE: compat
      PUBLIC_ORIGIN: "https://entra-emulator:8443"
    ports:
      # Overridable so this stack can coexist with the other emulator
      # families' compose projects on one machine:
      #   ENTRA_PORT=18443 ARM_PORT=18445 make up
      - "${ENTRA_PORT:-8443}:8443"
    healthcheck:
      test: ["CMD", "/usr/local/bin/entra-emulator", "healthcheck"]
      interval: 5s
      timeout: 2s
      retries: 10

  arm-emulator:
    image: ghcr.io/calvinchengx/arm-emulator:latest
    depends_on:
      entra-emulator:
        condition: service_healthy
    ports:
      - "${ARM_PORT:-8445}:8445"
    environment:
      # The issuer ARM-audience tokens are validated against.
      # 6f89cf12-… is entra's seeded tenant, and
      # https://management.azure.com is a well-known Azure resource in
      # entra-emulator v0.2.1+, so client credentials resolve the ARM audience
      # with no resource-app seed step.
      ARM_ENTRA_ISSUER: "https://entra-emulator:8443/6f89cf12-978b-4d23-ac18-9ef0c127cf87/v2.0"
      ARM_ENTRA_TLS_INSECURE: "true"
      ARM_TENANT_ID: "6f89cf12-978b-4d23-ac18-9ef0c127cf87"
      # The image bakes ARM_DATA_DIR=/data for callers who mount a volume
      # there. This file mounts none, so leaving it set would still start — it
      # would just write SQLite and the TLS cert into a container layer that
      # `docker compose down` deletes. Empty runs in-memory instead, which is
      # what a throwaway pair wants. To persist, drop this line and add:
      #   volumes: ["arm-data:/data"]     (plus a top-level `volumes: arm-data:`)
      ARM_DATA_DIR: ""
    healthcheck:
      test: ["CMD", "/usr/local/bin/arm-emulator", "healthcheck"]
      interval: 5s
      timeout: 2s
      retries: 10

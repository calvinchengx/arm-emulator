# Secret scanning and vulnerability scanning.
#
# Neither existed anywhere in the emulator family before this workflow. The
# gap that prompted it: govulncheck reported standard-library vulnerabilities
# in every Go repo, 6 to 25 each, all of them fixed by moving off Go 1.25. A
# scanner nobody runs is a scanner that finds nothing.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Vulnerabilities are published against code that has not changed, so this
    # cannot only run on push: a repo that is finished still needs watching.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # THE DOCS LANE, ON PULL REQUESTS ONLY. Jobs that cannot observe a markdown
  # file are gated on `docs_only != 'true'`; the jobs that READ the docs are
  # not, because they must run on exactly those changes. A push to main always
  # runs everything, whatever it touched -- see the classify step below.
  # See scripts/docs_only_change.py.
  #
  # Ported from fabric-emulator, which worked this out first.
  changes:
    name: Is this change documentation only?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      # Full history: the classifier diffs against the base, which a depth-1
      # checkout cannot see.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Beside the real classification, every time. A classifier that stopped
      # matching would answer `false` forever: safe, plausible, and silently
      # useless. The cases are the only thing that would notice.
      - run: python3 scripts/docs_only_change.py --self-test
      - id: classify
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # A force push and a branch's first commit both give the null sha.
          # Neither is a docs change; both run everything.
          # THE LANE IS FOR PULL REQUESTS. Every commit on main gets the full
          # matrix, whatever it touched; the reasoning is at the same step in
          # ci.yml.
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "event is ${GITHUB_EVENT_NAME}, not a pull request: every commit on main gets the full matrix"
            exit 0
          fi
          if ! git rev-parse -q --verify "$BASE^{commit}" >/dev/null; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "base '$BASE' is not a commit here; running everything"
            exit 0
          fi
          git diff --name-status "$BASE...$HEAD_SHA" | python3 scripts/docs_only_change.py


  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    # A wedged run must fail rather than sit in GitHub's 6-hour default,
    # where 'pending' and 'stuck' look identical.
    timeout-minutes: 15
    steps:
      # Full history: a secret that was committed and then removed is still in
      # the pack, still cloneable, and still leaked. Scanning only the tip
      # would report clean on exactly the case that matters most.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.0
        run: |
          curl -fsSL -o /tmp/gl.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gl.tgz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan the working tree
        run: gitleaks dir . --config .gitleaks.toml --no-banner --redact --verbose

      - name: Scan the history
      # --verbose here too, and it is not noise: without it a failing scan
      # logs "leaks found: 3" and nothing else, so the one job whose whole
      # output is "which line" names no line. --redact still masks the value.
        run: gitleaks git . --config .gitleaks.toml --no-banner --redact --verbose

  vulnerabilities:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    name: govulncheck
    runs-on: ubuntu-latest
    # A wedged run must fail rather than sit in GitHub's 6-hour default,
    # where 'pending' and 'stuck' look identical.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # Reports only vulnerabilities the code can actually REACH, so a finding
      # here is a call path rather than a dependency-tree coincidence.
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

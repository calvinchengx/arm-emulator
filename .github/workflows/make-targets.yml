name: Make targets

# The Makefile is the documented entry point: the README and
# docs/01-design.md both tell users to run `make doctor` / `make up` /
# `make status`, so it needs the same cross-OS guarantee the Go tests have.
# Nothing else in CI ran a single `make` command before this workflow existed.
#
# The failures this catches are platform-specific and invisible on Linux, which
# is exactly why they survive:
#   * a shell script checked out with CRLF fails at the shebang: `sh` reads the
#     trailing \r as part of the interpreter path (.gitattributes pins eol=lf;
#     `sh -n` below is what proves it stayed pinned).
#   * on Windows `python3` is a Microsoft Store alias stub: on PATH, so every
#     `command -v python3` check passes, and it exits 49 when actually run.
#   * GNU Make falls back to cmd.exe when it cannot find a shell on PATH, and
#     every recipe here is POSIX shell.
#   * an unquoted or wrongly-named variable expands to nothing, or to whatever
#     the caller happened to export; `make -n` catches that without running it.
#
# Docker coverage is Linux-only by necessity, not by choice: GitHub's macOS
# runners have no Docker daemon, and the Windows runners support only Windows
# containers, so the Linux images this stack is built from cannot run there. On
# those two the container targets are checked for correct EXPANSION rather than
# execution, which still catches the variable and quoting classes of bug.

on:
  workflow_call: # called by release.yml as a release gate
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # THE DOCS LANE. Jobs that cannot observe a markdown file are gated on
  # `docs_only != 'true'`; the jobs that READ the docs are not, because they
  # must run on exactly those changes. See scripts/docs_only_change.py.
  #
  # Ported from fabric-emulator, which worked this out first.
  changes:
    name: Is this change documentation only?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      # Full history: the classifier diffs against the base, which a depth-1
      # checkout cannot see.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Beside the real classification, every time. A classifier that stopped
      # matching would answer `false` forever: safe, plausible, and silently
      # useless. The cases are the only thing that would notice.
      - run: python3 scripts/docs_only_change.py --self-test
      - id: classify
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # A force push and a branch's first commit both give the null sha.
          # Neither is a docs change; both run everything.
          if ! git rev-parse -q --verify "$BASE^{commit}" >/dev/null; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "base '$BASE' is not a commit here; running everything"
            exit 0
          fi
          git diff --name-status "$BASE...$HEAD_SHA" | python3 scripts/docs_only_change.py

  # A docs-only change cannot alter what these jobs find. The gate is a JOB
  # rather than `paths-ignore:` on the workflow: a job skipped by `if:` reports
  # as successful to branch protection, while a workflow that never ran leaves
  # its check "Expected" forever and blocks the merge. This repository has no
  # protection today, which is what makes paths-ignore a landmine armed later
  # by a settings change nobody would connect to CI.
  #
  # See .github/changed-files.sh, which fails OPEN on every way of not knowing:
  # a first push, a force push, an unreadable comparison, an empty list, a
  # truncated one, a tag, or any path it does not recognise.
  changes:
    name: Does this change any code?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - name: The gate proves itself before it is trusted
        run: ./.github/changed-files.test.sh
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/changed-files.sh

  make-targets:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: make targets (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # macOS ships GNU Make 3.81 with the Xcode CLT and Linux ships it as
      # standard; only Windows needs one installed. Same story
      # docs/01-design.md tells users, via the package manager already
      # present on the runner.
      - name: Install GNU Make (Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install make --no-progress -y
          if ($LASTEXITCODE -eq 0) { exit 0 }
          # The community feed's search index has 404'd this package while the
          # nupkg itself was still there — twice on 2026-08-14, and the second
          # time it skipped the v0.4.0 image. Install from the nupkg URL so a
          # search outage cannot block a release.
          $dir = Join-Path $env:RUNNER_TEMP 'choco-make'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $nupkg = Join-Path $dir 'make.4.4.1.nupkg'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://community.chocolatey.org/api/v2/package/make/4.4.1' -OutFile $nupkg
          choco install make --source $dir --no-progress -y

      # Deliberately the runner's DEFAULT shell, PowerShell on Windows. This is
      # the one step that reproduces how a Windows user actually invokes make,
      # and it fails if Make cannot find sh.exe or the grep/awk the recipe uses.
      # One command per step so its exit code is the step's exit code: under
      # pwsh only the LAST command's status is checked.
      - name: make help (from the platform's native shell)
        run: make help

      - name: Makefile and scripts are POSIX-clean
        shell: bash
        run: |
          set -euo pipefail
          # Syntax-only, with the interpreter each script's shebang actually
          # declares: `sh -n` on a #!/usr/bin/env bash script would reject
          # legitimate bashisms, and `bash -n` on a #!/bin/sh script would let
          # real ones through. This is what catches a CRLF checkout (dash and
          # bash both reject a brace followed by a carriage return) and
          # any bashism creeping into an sh script.
          for f in scripts/*.sh; do
            case "$(head -1 "$f")" in
              *bash) echo "bash -n $f"; bash -n "$f" ;;
              *)     echo "sh -n   $f"; sh -n "$f" ;;
            esac
          done

      - name: Every target expands
        shell: bash
        run: |
          set -euo pipefail
          # -n prints the recipe without running it, so this exercises variable
          # expansion, quoting and the shell selection on every platform,
          # including the docker targets that cannot execute off Linux.
          for t in help doctor up down clean restart status ps logs test; do
            echo "=== make -n $t ==="
            make -n "$t"
          done
          # The documented overrides must expand too.
          make -n logs SVC=arm-emulator
          make -n up PROFILE="--profile full"

      - name: make test
        shell: bash
        run: make test

      # The real thing, where a Linux container runtime exists.
      - name: make doctor
        if: runner.os == 'Linux'
        run: make doctor

      # Build the image from THIS commit and tag it as the name compose
      # expects, instead of pulling the last published one. Two reasons:
      # the first release cannot pull an image that no release has pushed yet
      # (the gate would deadlock on itself), and testing the source in the PR
      # is what actually catches a broken Dockerfile — before the tag, not
      # after it.
      - name: Build the local image compose will use
        if: runner.os == 'Linux'
        run: docker build -t ghcr.io/${{ github.repository }}:latest .

      - name: make up / status / down
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          make up
          make status
          make down

      # Not `make logs`: that target follows (-f) and would hang the job.
      - name: Container logs on failure
        if: failure() && runner.os == 'Linux'
        run: docker compose logs --no-color --tail 200 || true

# CodeQL — advanced (in-repo) setup, replacing the repo's Default setup.
#
# Scoped to FIRST-PARTY code only:
#   - go                    the emulator (root module)
#   - javascript-typescript the docs website
#   - actions               these workflows
#
# Deliberately NOT scanned: python — it appears only as the az CLI witness
# harness under e2e/, i.e. a driver for Microsoft's client rather than code we
# author or ship.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '31 7 * * 1' # weekly, Monday 07:31 UTC (parity with Default setup)

# Superseding a PR run is free money. Superseding a main run is not: a cancelled
# CodeQL job still uploads its SARIF, flagged `unsuccessful execution` with zero
# results, and that errored analysis becomes the newest one for its category —
# which is exactly what the code-scanning tool status page reports. Landing a
# burst of commits cancelled 11 of our first 43 main runs this way. So main runs
# to completion; only PR pushes cancel.
# THE DEFAULT TOKEN IS NOT READ-ONLY, so say what this workflow may do.
# CodeQL's `actions/missing-workflow-permissions` flags a job that sets none:
# it inherits whatever the repository default is, which is a write token in
# many configurations and is never what a build needs. Declared here rather
# than per job, so a job added later cannot forget it; a job that genuinely
# needs more escalates in its own `permissions:` block, which overrides this.
permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # THE DOCS LANE, ON PULL REQUESTS ONLY. Jobs that cannot observe a markdown
  # file are gated on `docs_only != 'true'`; the jobs that READ the docs are
  # not, because they must run on exactly those changes. A push to main always
  # runs everything, whatever it touched -- see the classify step below.
  # See scripts/docs_only_change.py.
  #
  # Ported from fabric-emulator, which worked this out first.
  changes:
    name: Is this change documentation only?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      # Full history: the classifier diffs against the base, which a depth-1
      # checkout cannot see.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Beside the real classification, every time. A classifier that stopped
      # matching would answer `false` forever: safe, plausible, and silently
      # useless. The cases are the only thing that would notice.
      - run: python3 scripts/docs_only_change.py --self-test
      - id: classify
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # A force push and a branch's first commit both give the null sha.
          # Neither is a docs change; both run everything.
          # THE LANE IS FOR PULL REQUESTS. Every commit on main gets the full
          # matrix, whatever it touched; the reasoning is at the same step in
          # ci.yml.
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "event is ${GITHUB_EVENT_NAME}, not a pull request: every commit on main gets the full matrix"
            exit 0
          fi
          if ! git rev-parse -q --verify "$BASE^{commit}" >/dev/null; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "base '$BASE' is not a commit here; running everything"
            exit 0
          fi
          git diff --name-status "$BASE...$HEAD_SHA" | python3 scripts/docs_only_change.py


  analyze:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false # one language's failure must not hide the others
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Pin the Go toolchain so autobuild compiles the root module cleanly.
      # (Nested modules under e2e/ and samples/ are separate go.mod roots and are
      # excluded from the parent's `go build ./...`, so only the emulator builds.)
      - if: matrix.language == 'go'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.7
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.7
        with:
          category: '/language:${{ matrix.language }}'

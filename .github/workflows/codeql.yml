# CodeQL — advanced (in-repo) setup, replacing the repo's Default setup.
#
# Scoped to FIRST-PARTY code only:
#   - go                    the emulator (root module)
#   - javascript-typescript the docs website
#   - actions               these workflows
#
# Deliberately NOT scanned: python — it appears only as the az CLI witness
# harness under e2e/, i.e. a driver for Microsoft's client rather than code we
# author or ship.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '31 7 * * 1' # weekly, Monday 07:31 UTC (parity with Default setup)

# Superseding a PR run is free money. Superseding a main run is not: a cancelled
# CodeQL job still uploads its SARIF, flagged `unsuccessful execution` with zero
# results, and that errored analysis becomes the newest one for its category —
# which is exactly what the code-scanning tool status page reports. Landing a
# burst of commits cancelled 11 of our first 43 main runs this way. So main runs
# to completion; only PR pushes cancel.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A docs-only change cannot alter what these jobs find. The gate is a JOB
  # rather than `paths-ignore:` on the workflow: a job skipped by `if:` reports
  # as successful to branch protection, while a workflow that never ran leaves
  # its check "Expected" forever and blocks the merge. This repository has no
  # protection today, which is what makes paths-ignore a landmine armed later
  # by a settings change nobody would connect to CI.
  #
  # See .github/changed-files.sh, which fails OPEN on every way of not knowing:
  # a first push, a force push, an unreadable comparison, an empty list, a
  # truncated one, a tag, or any path it does not recognise.
  changes:
    name: Does this change any code?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - name: The gate proves itself before it is trusted
        run: ./.github/changed-files.test.sh
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/changed-files.sh

  analyze:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false # one language's failure must not hide the others
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Pin the Go toolchain so autobuild compiles the root module cleanly.
      # (Nested modules under e2e/ and samples/ are separate go.mod roots and are
      # excluded from the parent's `go build ./...`, so only the emulator builds.)
      - if: matrix.language == 'go'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.6
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.6
        with:
          category: '/language:${{ matrix.language }}'

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Both jobs only read the checkout; nothing here writes through GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  # THE DOCS LANE, ON PULL REQUESTS ONLY. Jobs that cannot observe a markdown
  # file are gated on `docs_only != 'true'`; the jobs that READ the docs are
  # not, because they must run on exactly those changes. A push to main always
  # runs everything, whatever it touched -- see the classify step below.
  # See scripts/docs_only_change.py.
  #
  # Ported from fabric-emulator, which worked this out first.
  changes:
    name: Is this change documentation only?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      # Full history: the classifier diffs against the base, which a depth-1
      # checkout cannot see.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Beside the real classification, every time. A classifier that stopped
      # matching would answer `false` forever: safe, plausible, and silently
      # useless. The cases are the only thing that would notice.
      - run: python3 scripts/docs_only_change.py --self-test
      - id: classify
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # A force push and a branch's first commit both give the null sha.
          # Neither is a docs change; both run everything.
          # THE LANE IS FOR PULL REQUESTS. EVERY COMMIT ON MAIN GETS THE
          # FULL MATRIX, whatever it touched.
          #
          # This was not the original rule, and the original rule was wrong.
          # A docs-only commit on main took the cheap lane and reported CI
          # SUCCESS having run a handful of jobs, so main's tip carried a
          # verdict no full run had produced. Each such green is locally true
          # -- a markdown file cannot break a Go test -- and that is exactly
          # what makes it dangerous: the commit is green and the branch's
          # state is unknown. fabric-emulator found this the expensive way,
          # with four tests broken under a green main for two days and two
          # open pull requests inheriting a red baseline nobody knew about.
          #
          # No commit on main has taken the lane here yet, in the last 20; the
          # defect is latent rather than realised. Left unfixed it is a matter of
          # time, and the failure mode is a green tip nobody can distinguish from
          # a measured one.
          #
          # Every commit on main is shipped, and each is what a bisect will
          # later ask about. A carried-forward verdict is not a verdict.
          #
          # The saving that matters is kept: iteration happens on the pull
          # request, where a docs change still runs a couple of jobs instead
          # of the whole matrix. Merging it costs one full run, once.
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "event is ${GITHUB_EVENT_NAME}, not a pull request: every commit on main gets the full matrix"
            exit 0
          fi
          if ! git rev-parse -q --verify "$BASE^{commit}" >/dev/null; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "base '$BASE' is not a commit here; running everything"
            exit 0
          fi
          git diff --name-status "$BASE...$HEAD_SHA" | python3 scripts/docs_only_change.py


  test:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    name: Build, vet & tests (incl. real ARM SDK e2e vs entra-emulator)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Naming the files matters: `test -z "$(gofmt -l .)"` fails with no
      # output at all, so the one check whose entire job is "which file" tells
      # you nothing and you reproduce it locally to find out.
      - name: gofmt
        # Linux only. Formatting is OS-independent, so checking it three times
        # adds nothing, and on Windows it fails for a reason that is not about
        # formatting at all: .gitattributes pins .sh, .py and .yml to LF but not
        # .go, so Git for Windows checks Go files out with CRLF and gofmt lists
        # every one of them. This is the same guard fabric-emulator uses.
        if: matrix.os == 'ubuntu-latest'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would change these files:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go build ./...
      # The server tests start a real entra-emulator in-process; the real
      # armresources / armauthorization SDKs drive this emulator over ARM's
      # wire with an ARM-audience token.
      - run: go test -coverpkg=./... -coverprofile=cover.out ./...
        shell: bash
      # 98%, not the family's usual 90%: everything reachable here IS covered,
      # and the ~1% residue is branches that can only run if the standard
      # library fails (crypto/rand erroring, sql.Open rejecting a compiled-in
      # driver name). Faking those would mean adding mutable global seams to
      # production crypto code, so they stay honestly uncovered — and the high
      # floor stops real gaps hiding behind that residue.
      - name: Coverage floor (98%)
        shell: bash
        run: |
          total=$(go tool cover -func=cover.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit (t < 98) ? 1 : 0 }'

  # The only witness in this repo that is a PACKAGED external client over a
  # network rather than a library linked into a Go test. `az` is installed on
  # the ubuntu runner already; entra comes from its pinned release, so this
  # leg also proves the released pair works together.
  az-cli:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    name: The real az CLI drives arm as a registered cloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: az version
      - run: ./e2e/az-cli/run.py

  sdks:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    name: Python, JS and .NET SDKs drive arm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.32"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      # Three vendor stacks that share nothing with the Go SDKs already
      # witnessing this repo: their own transports, token caches and
      # deserializers. Two real defects came out of writing them — a 301 on a
      # doubled slash that cost the JS SDKs their Authorization header, and a
      # ten-year certificate that macOS refuses to trust at all.
      - run: ./e2e/sdks/run.py

  witnesses:
    name: Every green parity claim names its witness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.32"
      - run: uv run --no-project --python 3.12 python scripts/check_witnesses.py --strict

      # THE DOCS' OWN LINK GATE, which existed in scripts/ and was run by
      # nothing: every sibling emulator runs `check_docs_links.py` from CI and
      # this repository did not, so a docs page could link at a page that does
      # not exist and nothing said so. Here rather than in docs-site.yml
      # because it belongs beside the other check that reads docs, and for the
      # same reason as that one it is NOT gated on `changes`.
      - run: uv run --no-project --python 3.12 python scripts/check_docs_links.py --strict
  lint:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # Gated at zero. The default linter set reports 522 findings across the
      # family, so .golangci.yml excludes unchecked Close, Rollback and Fprintf
      # where the return value is unactionable at the call site; everything
      # surviving that is fixed rather than suppressed. The issue caps are
      # lifted there too, since by default identical issues stop at three and
      # six unchecked Close calls were reported as two.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build, vet & tests (incl. real ARM SDK e2e vs entra-emulator)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - run: go vet ./...
      - run: go build ./...
      # The server tests start a real entra-emulator in-process; the real
      # armresources / armauthorization SDKs drive this emulator over ARM's
      # wire with an ARM-audience token.
      - run: go test -coverpkg=./... -coverprofile=cover.out ./...
        shell: bash
      # 98%, not the family's usual 90%: everything reachable here IS covered,
      # and the ~1% residue is branches that can only run if the standard
      # library fails (crypto/rand erroring, sql.Open rejecting a compiled-in
      # driver name). Faking those would mean adding mutable global seams to
      # production crypto code, so they stay honestly uncovered — and the high
      # floor stops real gaps hiding behind that residue.
      - name: Coverage floor (98%)
        shell: bash
        run: |
          total=$(go tool cover -func=cover.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit (t < 98) ? 1 : 0 }'

  witnesses:
    name: Every green parity claim names its witness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
      - run: uv run --no-project --python 3.12 python scripts/check_witnesses.py --strict

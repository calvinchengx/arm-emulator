version: 2

# Managed dependency updates: the Go module graph, the docs site's pnpm
# workspace, and the Actions used by CI/release.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # The Azure SDKs move together; a grouped PR keeps the witness suite
      # upgrading as one compatible set rather than one client at a time.
      azure-sdk:
        patterns: ['github.com/Azure/azure-sdk-for-go/*']

  # The docs site (pnpm workspace: root + website, one root lockfile).
  # Starlight peers a specific Astro major, so the pair must move together —
  # majors included, or a fix landing only in the next Astro major is stuck.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      docs-site:
        patterns: ['astro', '@astrojs/*', 'sharp']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
